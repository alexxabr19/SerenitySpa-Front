<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas | SerenitySpa</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="../index.html">SerenitySpa</a>
    <nav><a href="../index.html">Inicio</a></nav>
</header>
<main class="container">
    <p class="eyebrow">Administración</p>
    <h1>Facturas</h1>
    <p class="intro">Registra, consulta, actualiza y elimina facturas.</p>
    <section class="panel">
        <h2>Registrar o actualizar factura</h2>
        <form id="formFactura" class="form-grid">
            <label>ID de factura (solo para actualizar)
                <input id="idFactura" name="idFactura" type="number">
            </label>
            <label>Fecha
                <input id="fecha" name="fecha" type="date" required>
            </label>
            <label>Monto total
                <input id="montoTotal" name="montoTotal" type="number" step="0.01" required>
            </label>
            <label>Método de pago
                <input id="metodoPago" name="metodoPago" type="text" required>
            </label>
            <label>Estado
                <input id="estado" name="estado" type="text" required>
            </label>
            <label>ID de la cita
                <input id="idCita" name="idCita" type="number" required>
            </label>
            <button class="btn btn-primary" type="submit">Guardar factura</button>
        </form>
    </section>
    <div id="mensaje" class="message" role="status"></div>
    <section class="panel">
        <div class="section-heading">
            <h2>Registros</h2>
            <button id="btnRecargar" class="btn btn-secondary" type="button">Actualizar lista</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead id="tablaHead"></thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </section>
</main>
<script type="module" src="../js/facturas.js"></script>
</body>
</html>
